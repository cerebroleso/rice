[weather]
enabled = false

[widget.active_window]
max_length = 504
show_empty_label = true
title_scroll = "none"

[widget.audio_visualizer]
mirrored = false

[widget.media]
max_length = 300

[widget.network_rx]
network_speed_compact = true

[widget.spacer_10]
type = "spacer"

[widget.spacer_9]
type = "spacer"

[widget.workspaces]
display = "id"
minimal = false