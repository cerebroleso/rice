[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.04999999888241291

[bar.default]
auto_hide = false
border_width = 0.5
capsule = false
capsule_opacity = 0.74999998323619366
center = []
color = "primary"
contact_shadow = true
end = [
    "volume",
    "brightness",
    "clipboard",
    "spacer_14",
    "battery",
    "bluetooth",
    "network",
    "launcher",
    "spacer_7",
    "tray",
    "spacer_4",
    "notifications",
    "date",
    "clock"
]
font_weight = 300
margin_edge = 4
margin_ends = 12
margin_opposite_edge = 0
padding = 8
reserve_space = true
show_on_workspace_switch = true
start = [
    "control-center",
    "spacer_16",
    "wallpaper",
    "spacer_12",
    "workspaces",
    "spacer_10",
    "active_window",
    "spacer_17",
    "audio_visualizer"
]
thickness = 20
widget_spacing = 12

[control_center]
hidden_tabs = [ "media" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_opacity = 0.84999998100101948
active_scale = 0.80000001192092896
auto_hide = true
background_opacity = 0.29999999329447746
cross_axis_padding = 16
enabled = false
icon_size = 48
inactive_opacity = 0.84999998100101948
inactive_scale = 0.85000001266598701
item_spacing = 12
launcher_icon = "bread-filled"
launcher_position = "none"
magnification_scale = 1.2000000029802322
main_axis_padding = 32
margin_edge = 4
margin_ends = 0
pinned = [ "org.gnome.Nautilus", "helium", "kitty" ]
radius = 0
radius_bottom_left = 80
radius_bottom_right = 80
radius_top_left = 80
radius_top_right = 80
reserve_space = false

[location]
auto_locate = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = false

[notification]
offset_x = 24
offset_y = 24
scale = 1.0000000074505806

[osd]
offset_y = 64
position = "bottom_center"

    [osd.kinds]
    media = false

[shell]
app_icon_color = "primary"
app_icon_colorize = true
corner_radius_scale = 2.0
lang = "en"
polkit_agent = true

    [shell.panel]
    open_near_click_clipboard = false
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 16

    [shell.shadow]
    alpha = 0.54999998770654202

[theme]
builtin = "Ayu"
community_palette = "Espresso Cream"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "kcolorscheme", "qt", "kitty" ]
    community_ids = [ "vscode", "zed", "discord", "steam", "yazi", "zathura" ]

[wallpaper]
directory = "/home/chri/Pictures"

    [wallpaper.default]
    path = "/home/chri/Pictures/walls/snow-night-moon.png"

    [wallpaper.last]
    path = "/home/chri/Pictures/walls/snow-night-moon.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/chri/Pictures/walls/snow-night-moon.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/chri/Pictures/walls/snow-night-moon.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    path = "/home/chri/Pictures/walls/storm.jpg"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    path = "/home/chri/Pictures/walls/wp12654773-catalina-4k-wallpapers.jpg"
    theme_mode = "auto"

